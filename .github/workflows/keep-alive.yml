name: Keep Render Service Awake

on:
  schedule:
    # Triggers every 10 minutes to prevent Render free-tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -f -m 45 https://dum-biryani.onrender.com/api/health || echo "Ping complete"
